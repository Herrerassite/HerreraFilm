<!-- ═══════════════════════════════════════════════════════════════════════
     FORMULARIO DE CONTACTO PARA PAREJAS → CRM DE HELM
     ═══════════════════════════════════════════════════════════════════════

     Dónde va: SUSTITUYE al bloque .contacto-links de la sección de contacto —
     los tres enlaces de Email / Teléfono / Instagram — dentro de
     <div id="contacto-box" class="contacto-wrapper">. Todo lo de encima
     (.contacto-pretitle, .contacto-title, .contacto-text) se queda como está.

     El email y el teléfono no desaparecen del todo: si el envío falla por red,
     el aviso de error los da para que nadie se quede sin poder escribir.

     Ojo con main.js: el efecto 3D de la caja de contacto mueve los hijos
     DIRECTOS de #contacto-box uno a uno (querySelectorAll(':scope > *')). Por
     eso todo esto va envuelto en UN solo <form>, que es un hijo más y entra
     con el mismo escalonado que el resto. Si se parte en varios hermanos, el
     formulario se desmonta visualmente al hacer scroll.

     El orden de las preguntas es el que pidió Aitor y tiene su motivo: primero
     las siete de la boda, y los datos personales al final. Quien contesta
     sobre su boda antes de dejar el teléfono llega mucho más cualificado que
     quien solo suelta un email.

     A dónde van las respuestas: al CRM de Aitor en HELM
     (https://helm.s4sf.net/aitor-lopez), embudo "Bodas". Cada envío busca o
     crea el contacto, cuelga las respuestas de su ficha y lo anota en su
     actividad. Quien ya escribió antes cae en su ficha de siempre.

     El endpoint es público a propósito — lo llama gente de la calle desde su
     navegador — y por eso no hay ninguna clave aquí dentro: no serviría de
     nada, estaría a la vista en el HTML. La defensa está en el lado de HELM:
     solo acepta este perfil y este formulario, y limita por IP.
     ═══════════════════════════════════════════════════════════════════════ -->

<style>
/* Prefijo hf- en todo para no chocar con styles.css. */
.hf-form { margin-top: 60px; text-align: left; }

.hf-bloque { margin-bottom: 55px; }
.hf-bloque:last-of-type { margin-bottom: 0; }
.hf-pregunta {
  color: var(--champagne); font-family: var(--font-title); font-size: 1.3rem;
  line-height: 1.4; margin-bottom: 8px;
}
.hf-nota { color: var(--sepia-muted); font-size: 0.85rem; margin-bottom: 20px; }

/* Las opciones múltiples van como fichas y no como casillas: se tocan mejor en
   el móvil y encajan con el resto de la página, que no tiene un solo control
   de formulario a la vista. */
.hf-fichas { display: flex; flex-wrap: wrap; gap: 12px; }
.hf-ficha {
  border: 1px solid rgba(248, 242, 232, 0.22); border-radius: 50px;
  padding: 12px 24px; color: var(--crudo); font-size: 0.95rem; cursor: pointer;
  transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1); user-select: none;
  background: transparent; font-family: var(--font-body); text-align: left;
}
.hf-ficha:hover { border-color: var(--brand-sepia); color: var(--champagne); }
.hf-ficha.hf-on {
  border-color: var(--brand-sepia); background: var(--brand-sepia);
  color: var(--champagne);
}

.hf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
.hf-campo { display: flex; flex-direction: column; gap: 10px; }
.hf-campo.hf-ancho { grid-column: 1 / -1; }
.hf-campo label {
  color: var(--sepia-muted); font-size: 0.78rem; letter-spacing: 2px;
  text-transform: uppercase;
}
.hf-campo input, .hf-campo select, .hf-campo textarea {
  background: transparent; border: none; border-bottom: 1px solid rgba(248, 242, 232, 0.25);
  color: var(--champagne); font-family: var(--font-body); font-size: 1.05rem;
  padding: 10px 0; letter-spacing: -0.02em; border-radius: 0; /* iOS redondea los input */
  -webkit-appearance: none; appearance: none; transition: border-color 0.3s ease;
  /* Sin esto, el icono del calendario de <input type="date"> se pinta negro
     sobre negro y no se ve. */
  color-scheme: dark;
}
.hf-campo textarea { resize: vertical; min-height: 110px; line-height: 1.7; }
.hf-campo input:focus, .hf-campo select:focus, .hf-campo textarea:focus {
  outline: none; border-bottom-color: var(--brand-sepia);
}
/* El desplegable hereda el fondo del sistema al abrirse: las opciones se
   pintan a mano o en claro salen ilegibles sobre el marrón de la marca. */
.hf-campo select option { background: var(--bg-surface); color: var(--champagne); }
.hf-campo input::placeholder, .hf-campo textarea::placeholder { color: rgba(162, 145, 132, 0.6); }

.hf-check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; }
.hf-check input { width: 16px; height: 16px; margin-top: 3px; accent-color: var(--brand-sepia); flex-shrink: 0; }
.hf-check span { color: var(--sepia-muted); font-size: 0.88rem; line-height: 1.6; }
.hf-check-fecha { margin-top: 14px; }

.hf-legal { margin-top: 40px; }

.hf-enviar {
  display: block; margin: 45px auto 0;
  background: transparent; border: 1px solid rgba(248, 242, 232, 0.35);
  color: var(--champagne); font-family: var(--font-title); font-size: 1.2rem;
  letter-spacing: 2px; padding: 18px 60px; border-radius: 50px; cursor: pointer;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.hf-enviar:hover { background: var(--brand-sepia); border-color: var(--brand-sepia); transform: translateY(-3px); }
.hf-enviar:disabled { opacity: 0.5; cursor: default; transform: none; background: transparent; }

.hf-aviso { text-align: center; margin-top: 25px; font-size: 0.95rem; line-height: 1.7; }
.hf-aviso.hf-ok { color: var(--champagne); font-family: var(--font-title); font-size: 1.4rem; }
.hf-aviso.hf-error { color: #E88B6E; }

/* El honeypot: invisible para las personas, un campo más para los bots. No se
   usa display:none — hay bots que lo detectan y lo saltan. */
.hf-trampa { position: absolute; left: -9999px; opacity: 0; pointer-events: none; height: 0; }

@media (max-width: 768px) {
  .hf-grid { grid-template-columns: 1fr; gap: 26px; }
  .hf-form { margin-top: 45px; }
  .hf-bloque { margin-bottom: 45px; }
  .hf-ficha { padding: 11px 20px; font-size: 0.9rem; }
  .hf-enviar { width: 100%; padding: 18px 30px; }
}
</style>

<form class="hf-form" id="hf-form" novalidate>

  <!-- 1 -->
  <div class="hf-bloque">
    <p class="hf-pregunta">¿Qué estáis buscando?</p>
    <p class="hf-nota">Podéis marcar varias</p>
    <div class="hf-fichas" data-multi="buscais">
      <button type="button" class="hf-ficha">Película completa del día</button>
      <button type="button" class="hf-ficha">Trailer emocional, un resumen corto</button>
      <button type="button" class="hf-ficha">Sesión de pareja antes de la boda</button>
      <button type="button" class="hf-ficha">Fotografía también</button>
      <button type="button" class="hf-ficha">Vídeo con dron</button>
      <button type="button" class="hf-ficha">Aún no lo tenemos claro</button>
    </div>
  </div>

  <!-- 2, 3 -->
  <div class="hf-bloque hf-grid">
    <div class="hf-campo">
      <label for="hf-invitados">¿Cuántos invitados vais a ser aproximadamente? *</label>
      <select id="hf-invitados">
        <option value="">Elegid una opción</option>
        <option>Menos de 50</option>
        <option>Entre 50 y 100</option>
        <option>Entre 100 y 150</option>
        <option>Más de 150</option>
      </select>
    </div>
    <div class="hf-campo">
      <label for="hf-fotografo">¿Ya tenéis fotógrafo? *</label>
      <select id="hf-fotografo">
        <option value="">Elegid una opción</option>
        <option>Sí</option>
        <option>No</option>
        <option>Estamos mirando los dos a la vez</option>
      </select>
    </div>
  </div>

  <!-- 4 -->
  <div class="hf-bloque hf-grid">
    <div class="hf-campo hf-ancho">
      <label for="hf-como">¿Cómo nos habéis conocido? *</label>
      <select id="hf-como">
        <option value="">Elegid una opción</option>
        <option>Instagram</option>
        <option>Google</option>
        <option>Nos recomendó una pareja</option>
        <option>Nos recomendó otro proveedor (fotógrafo, wedding planner...)</option>
        <option>Otro</option>
      </select>
    </div>
  </div>

  <!-- 5 -->
  <div class="hf-bloque">
    <p class="hf-pregunta">¿Qué es lo que más os importa del vídeo?</p>
    <p class="hf-nota">Podéis marcar varias</p>
    <div class="hf-fichas" data-multi="importa">
      <button type="button" class="hf-ficha">Que se note la emoción real, no algo forzado</button>
      <button type="button" class="hf-ficha">Que tenga un acabado cinematográfico</button>
      <button type="button" class="hf-ficha">Poder revivirlo con la familia dentro de muchos años</button>
      <button type="button" class="hf-ficha">Tener algo bonito que compartir</button>
      <button type="button" class="hf-ficha">Que quede completo, sin que falte nada del día importante</button>
    </div>
  </div>

  <!-- 6, 7 -->
  <div class="hf-bloque hf-grid">
    <div class="hf-campo">
      <label for="hf-inversion">¿En qué inversión os movéis? *</label>
      <select id="hf-inversion">
        <option value="">Elegid una opción</option>
        <option>Hasta 1.000 €</option>
        <option>Entre 1.000 y 2.000 €</option>
        <option>Entre 2.000 y 3.000 €</option>
        <option>Más de 3.000 €</option>
        <option>Todavía no lo tenemos claro</option>
      </select>
    </div>
    <div class="hf-campo">
      <label for="hf-momento">¿En qué momento estáis? *</label>
      <select id="hf-momento">
        <option value="">Elegid una opción</option>
        <option>Ya queremos cerrarlo, estamos decidiendo ya</option>
        <option>Estamos comparando opciones</option>
        <option>Solo estamos mirando por ahora</option>
      </select>
    </div>
  </div>

  <!-- 8 -->
  <div class="hf-bloque hf-grid">
    <div class="hf-campo hf-ancho">
      <label for="hf-mensaje">¿Algo más que queráis contarnos?</label>
      <textarea id="hf-mensaje" placeholder="Lo que queráis: cómo os conocisteis, qué os importa del día, qué tipo de vídeo os emociona…"></textarea>
    </div>
  </div>

  <!-- 9 a 13 -->
  <div class="hf-bloque hf-grid">
    <div class="hf-campo hf-ancho">
      <label for="hf-nombre">Nombre y apellidos *</label>
      <input type="text" id="hf-nombre" required autocomplete="name" placeholder="Vuestros nombres">
    </div>

    <div class="hf-campo">
      <label for="hf-email">Email *</label>
      <input type="email" id="hf-email" required autocomplete="email" placeholder="marta@email.com">
    </div>

    <div class="hf-campo">
      <label for="hf-telefono">Teléfono / WhatsApp *</label>
      <input type="tel" id="hf-telefono" required autocomplete="tel" placeholder="+34 600 00 00 00">
    </div>

    <div class="hf-campo">
      <label for="hf-fecha">Fecha de la boda *</label>
      <input type="date" id="hf-fecha">
      <label class="hf-check hf-check-fecha">
        <input type="checkbox" id="hf-sinfecha">
        <span>Aún no tenemos fecha cerrada</span>
      </label>
    </div>

    <div class="hf-campo">
      <label for="hf-lugar">¿Dónde vais a casaros? *</label>
      <input type="text" id="hf-lugar" required placeholder="Ciudad o localización">
    </div>

    <!-- Trampa para bots. Una persona nunca lo ve, luego nunca lo rellena. -->
    <input class="hf-trampa" type="text" id="hf-web" tabindex="-1" autocomplete="off" aria-hidden="true">

    <label class="hf-check hf-legal hf-ancho">
      <input type="checkbox" id="hf-legal">
      <span>Acepto que Herrerafilm guarde estos datos para responder a mi consulta y hablar de la boda. Nada más, y se pueden borrar cuando queráis escribiendo a herrerafilm@gmail.com.</span>
    </label>
  </div>

  <button type="submit" class="hf-enviar" id="hf-enviar">Enviar</button>
  <p class="hf-aviso" id="hf-aviso" role="status" aria-live="polite"></p>
</form>

<script>
(function () {
  /* Los leads van al CRM de Aitor dentro de HELM, al embudo "Bodas". El perfil
     y el formulario tienen que existir allí (migración
     helm_formulario_contacto_herrerafilm.sql): si no, el endpoint responde 404
     y el envío se pierde. */
  const ENDPOINT    = 'https://helm.s4sf.net/api/formularios';
  const HELM_PERFIL = 'aitor-lopez';
  const HELM_FORM   = 'contacto';

  const form  = document.getElementById('hf-form');
  const boton = document.getElementById('hf-enviar');
  const aviso = document.getElementById('hf-aviso');
  if (!form) return;

  const $ = (id) => document.getElementById(id);
  const v = (id) => ($(id).value || '').trim();

  const decir = (texto, clase) => {
    aviso.textContent = texto;
    aviso.className = 'hf-aviso' + (clase ? ' hf-' + clase : '');
  };

  /* Fichas de opción múltiple. Se guarda el texto visible, no un código: es lo
     que se lee después en la ficha del CRM, y tiene que coincidir con las
     opciones que declara el formulario en HELM. */
  const multi = {};
  document.querySelectorAll('.hf-fichas').forEach((grupo) => {
    const clave = grupo.dataset.multi;
    multi[clave] = [];
    grupo.querySelectorAll('.hf-ficha').forEach((ficha) => {
      ficha.addEventListener('click', () => {
        const texto = ficha.textContent.trim();
        const i = multi[clave].indexOf(texto);
        if (i === -1) { multi[clave].push(texto); ficha.classList.add('hf-on'); }
        else { multi[clave].splice(i, 1); ficha.classList.remove('hf-on'); }
      });
    });
  });

  /* La fecha se manda escrita, no en formato ISO: en la ficha del CRM se lee
     "13 de junio de 2027", no "2027-06-13". Y quien marca que no la tiene
     cerrada manda justo eso, que para Aitor es una respuesta y no un hueco. */
  const fechaBoda = () => {
    if ($('hf-sinfecha').checked) return 'Aún no tenemos fecha cerrada';
    const iso = v('hf-fecha');
    if (!iso) return '';
    const d = new Date(iso + 'T12:00:00');
    if (Number.isNaN(d.getTime())) return iso;
    return d.toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' });
  };

  /* El calendario y la casilla se contradicen: marcar una apaga la otra. */
  $('hf-sinfecha').addEventListener('change', (e) => {
    $('hf-fecha').disabled = e.target.checked;
    if (e.target.checked) $('hf-fecha').value = '';
  });
  $('hf-fecha').addEventListener('change', () => {
    if ($('hf-fecha').value) $('hf-sinfecha').checked = false;
  });

  /* De qué anuncio o enlace viene la pareja. Va al CRM en sus propias columnas,
     que es por donde se filtra para ver qué trae bodas. */
  const utm = () => {
    const p = new URLSearchParams(location.search), m = {};
    for (const k of ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content']) {
      const val = p.get(k);
      if (val) m[k] = val.slice(0, 200);
    }
    return m;
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (boton.disabled) return;

    /* El bot que rellena todos los campos se va sin ruido: se le responde como
       si hubiera salido bien para que no vuelva a probar. */
    if (v('hf-web')) { decir('Gracias, os escribimos en breve.', 'ok'); form.reset(); return; }

    const nombre = v('hf-nombre'), email = v('hf-email'), telefono = v('hf-telefono');
    const fecha = fechaBoda();

    if (!multi.buscais.length)  return decir('Marcad al menos una opción en "¿Qué estáis buscando?".', 'error');
    if (!v('hf-invitados') || !v('hf-fotografo') || !v('hf-como') ||
        !v('hf-inversion') || !v('hf-momento')) {
      return decir('Faltan respuestas por elegir en los desplegables.', 'error');
    }
    if (!multi.importa.length) return decir('Marcad al menos una opción en "¿Qué es lo que más os importa del vídeo?".', 'error');
    if (!nombre || !email || !telefono || !v('hf-lugar')) {
      return decir('Faltan los campos marcados con *.', 'error');
    }
    if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) {
      return decir('Revisad el email, parece que falta algo.', 'error');
    }
    if (!fecha) return decir('Poned la fecha de la boda o marcad que aún no la tenéis cerrada.', 'error');
    if (!$('hf-legal').checked) {
      return decir('Hace falta aceptar el tratamiento de los datos para poder responderos.', 'error');
    }

    boton.disabled = true;
    const textoOriginal = boton.textContent;
    boton.textContent = 'Enviando…';
    decir('');

    try {
      const r = await fetch(ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          slug: HELM_PERFIL,
          form: HELM_FORM,
          nombre, email, telefono,
          origen: 'Web',
          /* Las claves son las que declara el formulario en HELM. Cualquier otra
             se descarta allí, así que renombrar una aquí es perderla. */
          respuestas: {
            buscais:            multi.buscais,
            invitados:          v('hf-invitados'),
            fotografo:          v('hf-fotografo'),
            como_nos_conociste: v('hf-como'),
            importa:            multi.importa,
            inversion:          v('hf-inversion'),
            momento:            v('hf-momento'),
            mensaje:            v('hf-mensaje'),
            fecha_boda:         fecha,
            lugar:              v('hf-lugar'),
          },
          meta: { landing_url: 'https://herrerafilm.com', ...utm() },
        }),
      });

      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Error');

      /* El formulario se sustituye por el acuse: dejarlo relleno invita a
         darle otra vez y duplicar la consulta. */
      form.querySelectorAll('.hf-bloque').forEach((b) => b.remove());
      boton.remove();
      decir('Gracias. Hemos recibido vuestra consulta y os escribimos en breve.', 'ok');
    } catch (err) {
      /* El lead no se pierde por un fallo de red: como el formulario sustituyó
         a la tarjeta de contacto, aquí es donde vuelven a aparecer el email y
         el teléfono. */
      decir('No hemos podido enviarlo. Escribidnos a herrerafilm@gmail.com o al +34 665 624 345 y lo vemos igual.', 'error');
      boton.disabled = false;
      boton.textContent = textoOriginal;
    }
  });
})();
</script>
